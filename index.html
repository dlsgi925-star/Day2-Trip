<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>후쿠오카 3박 4일 여행 일정표</title>
</head>
<body>
  <header>
    <h1>후쿠오카 3박 4일 여행</h1>
    <p>성인 4명 · 10월 출발</p>
  </header>

  <main>
    <section id="schedule">
      <h2>날짜별 일정</h2>

      <article id="day1">
        <h3>1일차</h3>
        <ul>
          <li>오후 도착</li>
          <li>캐널시티</li>
          <li>나카스 포장마차 (저녁)</li>
        </ul>
      </article>

      <article id="day2">
        <h3>2일차</h3>
        <ul>
          <li>다자이후 텐만구</li>
          <li>스타벅스 다자이후점</li>
          <li>저녁 모츠나베</li>
        </ul>
      </article>

      <article id="day3">
        <h3>3일차</h3>
        <ul>
          <li>유후인 당일치기 (버스 왕복)</li>
          <li>긴린코 호수</li>
        </ul>
      </article>

      <article id="day4">
        <h3>4일차</h3>
        <ul>
          <li>하카타역 쇼핑</li>
          <li>오후 출국</li>
        </ul>
      </article>
    </section>

    <section id="budget">
      <h2>1인 예산</h2>
      <table>
        <thead>
          <tr><th>항목</th><th>금액</th></tr>
        </thead>
        <tbody>
          <tr><td>항공</td><td data-amount="25">25만원</td></tr>
          <tr><td>숙소 (3박)</td><td data-amount="18">18만원</td></tr>
          <tr><td>식비</td><td data-amount="15">15만원</td></tr>
          <tr><td>교통</td><td data-amount="8">8만원</td></tr>
        </tbody>
        <tfoot>
          <tr><th>합계</th><th id="total">66만원</th></tr>
        </tfoot>
      </table>
    </section>

    <section id="checklist">
      <h2>준비물 체크리스트</h2>
      <ul>
        <li><label><input type="checkbox" data-id="item0"> 여권</label></li>
        <li><label><input type="checkbox" data-id="item1"> 유심</label></li>
        <li><label><input type="checkbox" data-id="item2"> 1인 엔화 3만엔</label></li>
        <li><label><input type="checkbox" data-id="item3"> 우산</label></li>
      </ul>
    </section>
  </main>

  <script>
    // 예산 합계: data-amount 값을 더해서 표시
    var total = 0;
    document.querySelectorAll('#budget [data-amount]').forEach(function (td) {
      total += Number(td.dataset.amount);
    });
    document.getElementById('total').textContent = total + '만원';

    // 체크리스트: 체크 상태를 localStorage에 저장/복원
    var KEY = 'fukuoka-checklist';
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
    document.querySelectorAll('#checklist input[type=checkbox]').forEach(function (box) {
      box.checked = !!saved[box.dataset.id];
      box.addEventListener('change', function () {
        saved[box.dataset.id] = box.checked;
        try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
      });
    });
  </script>
</body>
</html>
